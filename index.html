<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>野外来信｜自然与户外导航</title><meta name="description" content="看天气、认植物、找地图，也为下一次出发做好准备。分类查找、收藏常用网址。"><style>:root{--ink:#193e35;--bg:#eff5ec;--card:#fff;--hero:#cfe3c4;--accent:#a45a22;--gold:#f3ce9c;--muted:#526960;--border:#d4e2d7}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Manrope,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}a{color:inherit}button,input{font:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.wrap{max-width:1240px;margin:auto;padding:24px}.brand{font-size:20px;font-weight:700}.tag{font-size:14px;color:var(--muted)}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.hero{position:relative;overflow:hidden;margin:24px 0;padding:48px;border-radius:20px;background:var(--hero);min-height:210px}.hero h1{max-width:680px;font-size:clamp(36px,5vw,60px);line-height:1.12;letter-spacing:-.04em;margin:0 0 16px;position:relative;z-index:1}.hero p{margin:0;max-width:560px;font-size:18px;position:relative;z-index:1}.illustration{position:absolute;right:5%;bottom:-30px;width:250px;height:210px;opacity:.9}.books .illustration{background:repeating-linear-gradient(90deg,var(--accent) 0 20px,var(--gold) 20px 35px,var(--ink) 35px 50px,transparent 50px 58px);transform:rotate(-8deg);border-radius:8px}.nature .illustration{background:var(--gold);clip-path:polygon(0 100%,34% 22%,48% 52%,66% 4%,100% 100%)}.adult{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--ink);color:white;padding:20px 24px;border-radius:12px}.adult strong,.adult span{display:block}.adult span{font-size:14px;color:#dde7e0}.adult a{white-space:nowrap;padding:10px 16px;text-decoration:none;font-weight:700;background:var(--gold);color:var(--ink);border-radius:8px}.controls{display:flex;align-items:end;gap:12px;margin:24px 0}.search{flex:1}.search label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink)}.filter{padding:12px 16px;background:white;color:var(--ink);border:1px solid var(--border);border-radius:8px;font-weight:700;cursor:pointer}.filter[aria-pressed=true]{background:var(--ink);color:white}.layout{display:grid;grid-template-columns:210px 1fr;gap:32px}.side{align-self:start;position:sticky;top:24px}.side h2{font-size:14px;margin:0 0 12px}.side nav{display:flex;flex-direction:column;gap:8px}.side a{text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:700}.side a:hover{background:var(--hero)}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.group{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;scroll-margin-top:24px}.group h2{margin:0;font-size:24px}.group p{margin:4px 0 16px;font-size:14px;color:var(--muted)}.entry{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);padding:12px 0}.entry a{flex:1;text-decoration:none;min-width:0}.entry a:hover strong{text-decoration:underline}.entry strong,.entry small{display:block}.entry small{color:var(--muted);font-size:14px}.star{width:40px;height:40px;border:0;border-radius:50%;font-size:20px;background:var(--bg);color:var(--muted);cursor:pointer}.star[aria-pressed=true]{background:var(--gold);color:var(--ink)}.empty{display:none;background:white;padding:32px;text-align:center;border-radius:12px}.footer{color:var(--muted);font-size:14px;margin:40px 0 16px}.nature .layout{display:block}.nature .side{position:static;margin:0 0 24px}.nature .side nav{flex-direction:row;flex-wrap:wrap}.nature .side a{background:white;border:1px solid var(--border)}.nature .groups{grid-template-columns:repeat(3,minmax(0,1fr))}.nature .group:nth-child(3n+1){border-top:6px solid #b9d4a2}.nature .group:nth-child(3n+2){border-top:6px solid #dd9250}.nature .group:nth-child(3n){border-top:6px solid #8bb3a1}@media(max-width:900px){.nature .groups{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:32px}.illustration{opacity:.25}}@media(max-width:640px){.wrap{padding:16px}.tag{display:none}.hero{padding:32px 24px;min-height:0}.hero h1{font-size:30px}.hero p{font-size:16px}.illustration{width:130px;height:130px}.adult{align-items:flex-start;flex-direction:column}.controls{align-items:stretch;flex-direction:column}.layout{display:block}.side{position:static;margin-bottom:24px}.side nav{flex-direction:row;overflow:auto}.side a{white-space:nowrap}.groups,.nature .groups{grid-template-columns:1fr}.nature .side nav{flex-wrap:nowrap}.group{padding:20px}}</style></head><body class="nature"><div class="wrap"><header><div class="brand">✳ 野外来信</div><span class="tag">自然与户外导航</span></header><main><section class="hero"><h1>把好奇心带到户外。</h1><p>看天气、认植物、找地图，也为下一次出发做好准备。</p><div class="illustration" aria-hidden="true"></div></section><section class="adult" aria-label="成人内容入口"><div><strong>成人内容百科</strong><span>成人内容入口，仅限年满 18 周岁者访问</span></div><a href="https://chengrenbaike.com/" target="_blank" rel="noopener noreferrer">访问成人百科 ↗</a></section><div class="controls"><div class="search"><label for="query">查找网址</label><input id="query" type="search" placeholder="输入网站或分类关键词"></div><button class="filter" id="filter" aria-pressed="false">只看收藏 ☆</button></div><div class="layout"><aside class="side"><h2>浏览分类</h2><nav id="nav" aria-label="分类导航"></nav></aside><div><div class="groups" id="groups"></div><div class="empty" id="empty" role="status"></div></div></div></main><footer class="footer">野外来信 · 收藏保存在当前浏览器中，外部网站内容以各站为准。</footer></div><script>const groups=[["地图与路线","出发前先看清方向",["OpenStreetMap","https://www.openstreetmap.org/","开放地图与地点"],["高德地图","https://www.amap.com/","地点与路线查询"],["百度地图","https://map.baidu.com/","地图与出行信息"],["AllTrails","https://www.alltrails.com/","徒步路线与社区"]],["天气与环境","留意天气变化",["中国天气网","https://www.weather.com.cn/","天气预报与资讯"],["Windy","https://www.windy.com/","风场与天气地图"],["中央气象台","https://www.nmc.cn/","气象预报与预警"],["AirNow","https://www.airnow.gov/","空气质量信息"]],["观察自然","发现身边的生物",["iNaturalist","https://www.inaturalist.org/","记录动植物观察"],["eBird","https://ebird.org/","鸟类观察与记录"],["中国自然标本馆","https://www.cfh.ac.cn/","自然物种与标本资料"],["GBIF","https://www.gbif.org/","全球生物多样性数据"]],["徒步与山野","了解户外活动",["Leave No Trace","https://lnt.org/","户外环境保护知识"],["National Park Service","https://www.nps.gov/","美国国家公园信息"],["The Mountaineers","https://www.mountaineers.org/","登山与户外教育"]],["星空与地球","向远处多看一眼",["NASA Earth Observatory","https://earthobservatory.nasa.gov/","地球影像与故事"],["Stellarium Web","https://stellarium-web.org/","在线星图"],["EarthSky","https://earthsky.org/","天文与自然资讯"]],["自然阅读","给好奇心多一点时间",["National Geographic","https://www.nationalgeographic.com/","自然与探索故事"],["BBC Earth","https://www.bbcearth.com/","自然影像与文章"],["Smithsonian Magazine","https://www.smithsonianmag.com/","自然与科学故事"]]];const id="wildletter-nov03",box=document.querySelector('#groups'),nav=document.querySelector('#nav'),search=document.querySelector('#query'),filter=document.querySelector('#filter'),empty=document.querySelector('#empty');let saved=[];try{saved=JSON.parse(localStorage.getItem(id)||'[]')}catch{}if(!Array.isArray(saved))saved=[];let only=false;groups.forEach((g,i)=>{const a=document.createElement('a');a.href='#group-'+i;a.textContent=g[0];nav.append(a)});function render(){box.replaceChildren();let n=0;const q=search.value.trim().toLowerCase();groups.forEach((g,i)=>{const found=g.slice(2).filter(x=>(!q||[g[0],...x].join(' ').toLowerCase().includes(q))&&(!only||saved.includes(x[1])));if(!found.length)return;n+=found.length;const sec=document.createElement('section');sec.id='group-'+i;sec.className='group';const h=document.createElement('h2');h.textContent=g[0];const p=document.createElement('p');p.textContent=g[1];sec.append(h,p);found.forEach(([name,url,desc])=>{const row=document.createElement('div');row.className='entry';const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';const t=document.createElement('strong');t.textContent=name+' ↗';const d=document.createElement('small');d.textContent=desc;a.append(t,d);const b=document.createElement('button');b.className='star';b.setAttribute('aria-label','收藏 '+name);b.setAttribute('aria-pressed',String(saved.includes(url)));b.textContent=saved.includes(url)?'★':'☆';b.onclick=()=>{saved=saved.includes(url)?saved.filter(x=>x!==url):[...saved,url];try{localStorage.setItem(id,JSON.stringify(saved))}catch{}render()};row.append(a,b);sec.append(row)});box.append(sec)});empty.style.display=n?'none':'block';empty.textContent=only&&!q?'还没有收藏网址，点击星标即可收藏。':'没有找到匹配的网址，试试其他关键词。'}search.addEventListener('input',render);filter.onclick=()=>{only=!only;filter.setAttribute('aria-pressed',String(only));filter.textContent=only?'显示全部':'只看收藏 ☆';render()};render();</script></body></html>
